<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>غير متصل بالإنترنت</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --fg: #1b1b1b;
        --fg-soft: #5a5a5a;
        --border: #e3e1dc;
        --accent: #b45309;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101216;
          --fg: #ecebe7;
          --fg-soft: #a3a3a3;
          --border: #2a2e36;
          --accent: #f0a95c;
          --card: #16181d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
        line-height: 1.9;
        padding: 1.25rem;
      }
      .box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2.5rem 2rem;
        max-width: 26rem;
        width: 100%;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--fg-soft);
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        padding: 0.7rem 1.5rem;
        border-radius: 12px;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>غير متصل بالإنترنت</h1>
      <p>يبدو أنك غير متصل بالإنترنت الآن. أعد الاتصال ثم حاول مجددًا.</p>
      <a href="/">العودة إلى الرئيسية</a>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
